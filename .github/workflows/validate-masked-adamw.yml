name: Validate masked AdamW
on:
  push:
    branches: [codex/validate-masked-adamw-20261031]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.5.1'
          - python: '3.11'
            torch: '2.9.1'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'optree==0.17.0' graphviz typing-extensions 'pytest==8.4.2' 'black==24.10.0' 'isort==5.13.2' 'ruff==0.6.9'
          python -m pip freeze > dependencies.txt
      - name: Baseline regression
        run: |
          git fetch --depth=1 origin 960fb0aa53f27bad1af0bdf018b5ad4be077949a
          cp torchopt/alias/adamw.py /tmp/adamw.fixed.py
          cp torchopt/transform/add_decayed_weights.py /tmp/add_decayed_weights.fixed.py
          git show 960fb0aa53f27bad1af0bdf018b5ad4be077949a:torchopt/alias/adamw.py > torchopt/alias/adamw.py
          git show 960fb0aa53f27bad1af0bdf018b5ad4be077949a:torchopt/transform/add_decayed_weights.py > torchopt/transform/add_decayed_weights.py
          set +e
          PYTHONPATH=. python -m pytest tests/test_masked_adamw.py -q --junitxml=before.xml
          result=$?
          set -e
          cp /tmp/adamw.fixed.py torchopt/alias/adamw.py
          cp /tmp/add_decayed_weights.fixed.py torchopt/transform/add_decayed_weights.py
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('before.xml').getroot()[0]
          assert int(suite.attrib['failures']) > 0, suite.attrib
          assert int(suite.attrib['errors']) == 0, suite.attrib
          assert int(suite.attrib['skipped']) == 0, suite.attrib
          print(suite.attrib)
          PY
      - name: Patched regressions
        run: PYTHONPATH=. python -m pytest tests/test_masked_adamw.py -q --junitxml=regression.xml
      - name: Native optimizer and transformation suites
        run: |
          PYTHONPATH=. python -m pytest tests/test_alias.py tests/test_transform.py tests/test_combine.py -q -W "ignore:We've integrated functorch into PyTorch:FutureWarning" --junitxml=after.xml
      - name: Changed-file style checks
        run: |
          python -m ruff check torchopt/alias/adamw.py torchopt/transform/add_decayed_weights.py tests/test_masked_adamw.py
          python -m black --check torchopt/alias/adamw.py torchopt/transform/add_decayed_weights.py tests/test_masked_adamw.py
          python -m isort --check-only torchopt/alias/adamw.py torchopt/transform/add_decayed_weights.py tests/test_masked_adamw.py
      - name: Record exact sources
        if: always()
        run: |
          git rev-parse HEAD > revision.txt
          sha256sum torchopt/alias/adamw.py torchopt/transform/add_decayed_weights.py tests/test_masked_adamw.py > source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masked-adamw-${{ matrix.python }}-${{ matrix.torch }}
          path: |
            before.xml
            after.xml
            regression.xml
            dependencies.txt
            revision.txt
            source.sha256
